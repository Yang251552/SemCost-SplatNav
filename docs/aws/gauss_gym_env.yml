name: gauss_gym
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.8.*
  - pytorch=2.4.1=*cu121*
  - torchvision=0.19.*
  - cudatoolkit=12.1
  - pip
  - pip:
      # GaussGym pins gsplat to a GIT COMMIT (uv.lock: version 1.5.3 @ 2323de5...),
      # NOT PyPI. PyPI 1.5.3 may diverge; pin the exact commit for reproducibility.
      - gsplat @ git+https://github.com/nerfstudio-project/gsplat.git@2323de5905d5e90e035f792fe65bad0fedd413e7
      # TODO: IsaacGym Preview 4 wheel must be installed manually from the
      # downloaded NVIDIA package; GaussGym pins isaacgym==1.0rc4.
      - isaacgym==1.0rc4
